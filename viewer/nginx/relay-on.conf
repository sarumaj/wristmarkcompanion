# The control channel's relay beside the viewer (compose.yaml, RELAY=on): /relay/ goes to
# its container. Unbuffered, so that the viewer's event stream and the watch's long-poll
# pass each message at once; held up to a minute (the long-poll waits 25 seconds, the
# stream sends a comment every 15). Not in the access log: the paths hold channel IDs.
location /relay/ {
    access_log off;
    proxy_pass http://relay:8081;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    client_max_body_size 4k;
}
