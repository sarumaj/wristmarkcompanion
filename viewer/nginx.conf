# The viewer's static files. The headers keep the privacy promise enforceable,
# not only stated: the page may load and connect to its own origin only
# (connect-src 'self'), so no camera frame or analytics can leave the browser
# even by mistake. The camera is allowed for this origin alone.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # three.js alone is 2.1 MB of JavaScript (no bundler, so no tree shaking).
    gzip on;
    gzip_types text/css application/javascript;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    # For the deployment's health check; the headers above do not apply here.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
