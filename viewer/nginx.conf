# The viewer's static files. The headers keep the privacy promise enforceable,
# not only stated: the page may load and connect to its own origin only
# (connect-src 'self'), so no camera frame or analytics can leave the browser
# even by mistake. The camera is allowed for this origin alone, and so are the
# motion sensors, read only once switched on for the models that follow how the
# watch is held.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # three.js alone is 2.1 MB of JavaScript (no bundler, so no tree shaking); the hand
    # tracking's WebAssembly 14 MB, and its model 7.8 MB.
    gzip on;
    gzip_types text/css application/javascript application/wasm application/octet-stream;

    # 'wasm-unsafe-eval' lets the hand tracking compile its WebAssembly (from this origin,
    # as everything else); it allows no eval() of JavaScript.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Permissions-Policy "camera=(self), accelerometer=(self), gyroscope=(self), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    # For the deployment's health check; the headers above do not apply here.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The web app manifest's type, which nginx's types don't know (it would be
    # application/octet-stream). The headers above still apply: no add_header here.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
    }

    # JavaScript modules ending in .mjs (MediaPipe's bundle), which nginx's types don't know:
    # as application/octet-stream, with nosniff, browsers refuse to run them, and the hand
    # tracking couldn't start.
    location ~* \.mjs$ {
        types { }
        default_type text/javascript;
        expires -1;
    }

    # The control channel's relay: passed to its container, or its health "off" where it
    # isn't deployed (nginx/relay-on.conf, nginx/relay-off.conf; the Dockerfile's RELAY).
    include /etc/nginx/relay.conf;

    # Every file asked again, by its ETag, before it is used (Cache-Control: no-cache, from
    # `expires`, which unlike add_header keeps the headers above): the files have no
    # versions in their names, and an index.html cached from one release with an app.js
    # of the next breaks the page.
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }
}
