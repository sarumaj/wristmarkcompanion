<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wristmark viewer</title>
  <link rel="stylesheet" href="style.css">
  <!-- js-aruco2 (classic scripts, globals CV, AR, SVD, POS), in this order, before the modules. -->
  <script defer src="vendor/js-aruco2/cv.js"></script>
  <script defer src="vendor/js-aruco2/aruco.js"></script>
  <script defer src="vendor/js-aruco2/dictionaries/aruco_4x4_1000.js"></script>
  <script defer src="vendor/js-aruco2/svd.js"></script>
  <script defer src="vendor/js-aruco2/posit1.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body data-state="idle">
  <main class="viewer">
    <div class="stage">
      <video id="camera" playsinline muted></video>
      <canvas id="overlay"></canvas>
      <pre id="debug" hidden></pre>
    </div>
    <p id="status" role="status">Point the camera at the watch's marker.</p>
    <p class="actions">
      <button id="start" type="button">Start the camera</button>
      <button id="debug-toggle" type="button" aria-pressed="false">Debug</button>
    </p>
    <p class="links"><a href="markers.html">Markers for testing without a watch</a></p>
  </main>
</body>
</html>
