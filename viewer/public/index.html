<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <title>WristMarkCompanion viewer</title>
  <link rel="stylesheet" href="style.css">
  <!-- js-aruco2 (classic scripts, globals CV, AR, SVD, POS), in this order, before the modules. -->
  <script defer src="vendor/js-aruco2/cv.js"></script>
  <script defer src="vendor/js-aruco2/aruco.js"></script>
  <script defer src="vendor/js-aruco2/dictionaries/aruco_4x4_1000.js"></script>
  <script defer src="vendor/js-aruco2/svd.js"></script>
  <script defer src="vendor/js-aruco2/posit1.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body class="app" data-state="idle">
  <header class="topbar">
    <a class="brand" href="./">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="logo-gradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#5b8cff"/>
            <stop offset="1" stop-color="#9b6bff"/>
          </linearGradient>
        </defs>
        <rect x="1" y="1" width="30" height="30" rx="9" fill="url(#logo-gradient)"/>
        <rect x="7" y="7" width="18" height="18" rx="2" fill="#0b0d12"/>
        <rect x="10" y="10" width="5" height="5" fill="#fff"/>
        <rect x="17" y="10" width="5" height="5" fill="#fff"/>
        <rect x="10" y="17" width="5" height="5" fill="#fff"/>
      </svg>
      <span>WristMark<span class="brand-soft">Companion</span></span>
    </a>
    <button id="debug-toggle" class="chip" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Debug
    </button>
  </header>

  <main class="viewer">
    <div class="stage">
      <video id="camera" playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div id="debug" class="debug" hidden></div>
      <section class="intro" aria-labelledby="intro-title">
        <svg class="intro-art" viewBox="0 0 160 150" aria-hidden="true">
          <defs>
            <linearGradient id="cube-top" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#8fb0ff"/>
              <stop offset="1" stop-color="#b79bff"/>
            </linearGradient>
          </defs>
          <g class="intro-cube">
            <path d="M80 8 104 21 80 34 56 21Z" fill="url(#cube-top)"/>
            <path d="M56 21 80 34V60L56 47Z" fill="#4f6fd8"/>
            <path d="M104 21 80 34V60L104 47Z" fill="#6c55c9"/>
          </g>
          <rect x="62" y="74" width="36" height="12" rx="4" fill="#2a3040"/>
          <rect x="62" y="136" width="36" height="12" rx="4" fill="#2a3040"/>
          <circle cx="80" cy="111" r="34" fill="#1b2030" stroke="#3a4256" stroke-width="4"/>
          <rect x="64" y="95" width="32" height="32" fill="#fff"/>
          <rect x="68" y="99" width="24" height="24" fill="#0b0d12"/>
          <rect x="74" y="105" width="6" height="6" fill="#fff"/>
          <rect x="80" y="111" width="6" height="6" fill="#fff"/>
          <rect x="74" y="117" width="6" height="6" fill="#fff"/>
          <rect x="86" y="99" width="6" height="6" fill="#fff"/>
        </svg>
        <h1 id="intro-title">Your watch, in 3D</h1>
        <ol class="steps">
          <li><span>Open <strong>WristMarkCompanion</strong> on the watch.</span></li>
          <li><span>Start the camera.</span></li>
          <li><span>Point it at the watch's marker.</span></li>
        </ol>
        <button id="start" class="primary" type="button">Start the camera</button>
        <p class="fineprint">The camera image never leaves this device.</p>
      </section>
      <section class="failure" role="alert" aria-labelledby="failure-title">
        <svg class="failure-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v6M12 16.5v.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        <h2 id="failure-title">The viewer stopped</h2>
        <p id="failure-text"></p>
        <button id="retry" class="primary" type="button">Try again</button>
      </section>
      <p id="status" class="status" role="status">Point the camera at the watch's marker.</p>
    </div>
    <section id="guide" class="guide" aria-label="Device test" hidden></section>
  </main>

  <footer class="links">
    <a href="markers.html">Markers without a watch</a>
    <a href="?test">Device test</a>
    <a href="privacy.html">Privacy</a>
  </footer>
</body>
</html>
