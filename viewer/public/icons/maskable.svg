<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The logo full-bleed, its marker inside the central 60 %: Android's adaptive icons
       crop to a circle or squircle within the safe zone, and iOS rounds the corners. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#9b6bff"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" fill="url(#g)"/>
  <rect x="9.5" y="9.5" width="13" height="13" rx="1.5" fill="#0b0d12"/>
  <rect x="11.7" y="11.7" width="3.6" height="3.6" fill="#fff"/>
  <rect x="16.7" y="11.7" width="3.6" height="3.6" fill="#fff"/>
  <rect x="11.7" y="16.7" width="3.6" height="3.6" fill="#fff"/>
</svg>
