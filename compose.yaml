# The viewer with the control channel's relay (docs/dev/deployment.md#with-the-relay): the app
# panel's "Docker Compose" build pack. The viewer's nginx serves the page and passes
# /relay/ to the relay, so both share one origin, and the CSP's connect-src 'self' holds.
# Only the viewer is exposed (port 8080, the app's domain); the relay is reached through it.
services:
  viewer:
    build:
      context: viewer
      args:
        RELAY: "on"
    depends_on:
      relay:
        condition: service_healthy
    restart: unless-stopped

  relay:
    build: relay
    restart: unless-stopped
    # RELAY_LOG=1 in the app panel's environment: a line per request (route, status, time;
    # no IDs, addresses or bodies) for troubleshooting, as the privacy page says. Off
    # otherwise.
    environment:
      RELAY_LOG: ${RELAY_LOG:-0}
    # The relay bounds its own memory (1,000 channels, 32 MB queued); this bound keeps a
    # flaw in that from reaching the other apps on the host.
    mem_limit: 128m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
