# A release, on a version tag (vX.Y.Z): the watch's store package, the Android app's
# APK and App Bundle (for Google Play), the viewer's files and the release notes from CHANGELOG.md on a Forgejo release,
# and the viewer deployed to the app host (docs/dev/deployment.md). Nothing else is uploaded.
name: release
'on':
  push:
    tags: [v*]
  # Run by hand to retry a release, or to deploy an older tag again (rollback).
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release (vX.Y.Z)
        type: string
        required: true

concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # As in ci.yml's watch job: the SDK installed on the runner's host.
  CONNECTIQ_SDK: 9.3.0
  CONNECTIQ_HOME: /opt/connectiq

jobs:
  release:
    # The SDK is mounted only in the runner containers of one CI host, whose runners offer
    # the label connectiq (docs/dev/ci.md); they also have Docker for the viewer's files.
    runs-on: [ubuntu-latest, connectiq]
    timeout-minutes: 30
    steps:
      # X.Y.Z exactly, Y and Z below 100: the Android version code is X·10000 + Y·100 + Z
      # (app/android/app/build.gradle), so 0.100.0 would collide with 1.0.0, and a fourth
      # part or a suffix would be dropped.
      - name: Check the tag
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}$'; then
            echo "::error::$TAG is not a release tag (vX.Y.Z, Y and Z below 100)"
            exit 1
          fi

      - name: Check out the tag
        uses: https://github.com/actions/checkout@v7
        with:
          lfs: true
          ref: refs/tags/${{ env.TAG }}

      # The notes are the version's section of CHANGELOG.md, "## X.Y.Z - date" as the
      # release bot writes it or "## [X.Y.Z]" by hand; a release without one fails here
      # rather than going out with notes made up from commit subjects.
      - name: Write the release notes
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          awk -v v="${TAG#v}" '/^## / { if (found) exit; h = $2; gsub(/^\[|\]$/, "", h)
            if (h == v) { found = 1; next } } found' CHANGELOG.md \
            | sed -e '/^\[[^]]*\]: /d' -e '/./,$!d' > "$RUNNER_TEMP/notes.md"
          if [ -z "$(tr -d '[:space:]' < "$RUNNER_TEMP/notes.md")" ]; then
            echo "::error::CHANGELOG.md has no section '## ${TAG#v}'"
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"

      - name: Set up Java
        uses: https://github.com/actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # The viewer's packages: the QR code of WRISTMARK_ORIGIN for the watch, and the
      # Android app's web files.
      - name: Set up Node.js
        uses: https://github.com/actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install the viewer's packages
        run: npm ci --prefix viewer --ignore-scripts --no-audit --no-fund

      # The developer key, base64 of its DER file (docs/dev/publishing.md): written for
      # this step only and deleted, also when the build fails. The viewer's address is
      # the repository variable WRISTMARK_ORIGIN, or the default where it is unset
      # (docs/dev/watch.md#the-viewers-address).
      - name: Build the store package
        env:
          CONNECTIQ_DEVELOPER_KEY: ${{ secrets.CONNECTIQ_DEVELOPER_KEY }}
          WRISTMARK_ORIGIN: ${{ vars.WRISTMARK_ORIGIN }}
        run: |
          if [ -z "$CONNECTIQ_DEVELOPER_KEY" ]; then
            echo "::error::The Actions secret CONNECTIQ_DEVELOPER_KEY is missing (docs/dev/publishing.md)"
            exit 1
          fi
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s' "$CONNECTIQ_DEVELOPER_KEY" | base64 -d > "$key"
          CONNECTIQ_KEY=$key tools/build-watch.sh --package "$CONNECTIQ_SDK" "$RUNNER_TEMP/watch"
          cp "$RUNNER_TEMP/watch/wristmark.iq" "$RUNNER_TEMP/release/wristmark-$TAG.iq"

      # The Android app (docs/dev/android.md): the release APK and App Bundle, signed with
      # the key in the secrets (written for this step only), their certificate checked
      # against the one docs/dev/android.md#signing names, so that a wrong key never goes
      # out. The bundle is uploaded to Google Play by hand (docs/dev/google-play.md).
      - name: Build the Android app
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WRISTMARK_ORIGIN: ${{ vars.WRISTMARK_ORIGIN }}
          CERTIFICATE_SHA256: b3295ca076aaa3baa9e1f1a56a7e696b85777e2a15e22765014a4b7aa0ea243b
        run: |
          if [ -z "$ANDROID_KEYSTORE" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::The Actions secrets ANDROID_KEYSTORE and ANDROID_KEYSTORE_PASSWORD are missing (docs/dev/android.md#signing)"
            exit 1
          fi
          keystore=$(mktemp)
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$keystore"
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          tools/install-android-sdk.sh "$ANDROID_HOME"
          APP_VERSION="${TAG#v}" ANDROID_KEYSTORE_FILE="$keystore" tools/build-android.sh release "$RUNNER_TEMP/apk"
          apk="$RUNNER_TEMP/apk/app-release.apk"
          signer=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          if [ "$signer" != "$CERTIFICATE_SHA256" ]; then
            echo "::error::The APK is signed by $signer, not the release key $CERTIFICATE_SHA256"
            exit 1
          fi
          cp "$apk" "$RUNNER_TEMP/release/wristmark-$TAG.apk"
          # The bundle is signed as a JAR: keytool prints its certificate's fingerprint.
          aab="$RUNNER_TEMP/apk/app-release.aab"
          bundle_signer=$(keytool -printcert -jarfile "$aab" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          if [ "$bundle_signer" != "$CERTIFICATE_SHA256" ]; then
            echo "::error::The App Bundle is signed by $bundle_signer, not the release key $CERTIFICATE_SHA256"
            exit 1
          fi
          cp "$aab" "$RUNNER_TEMP/release/wristmark-$TAG.aab"

      # The files the image serves, libraries included, as one archive.
      - name: Pack the viewer
        run: |
          image="wristmark-viewer:release-$GITHUB_RUN_ID"
          docker build --pull --no-cache -t "$image" viewer
          tools/smoke-test.sh "$image"
          container=$(docker create "$image")
          docker cp "$container:/usr/share/nginx/html" "$RUNNER_TEMP/viewer"
          docker rm "$container" > /dev/null
          docker image rm -f "$image" > /dev/null
          tar -C "$RUNNER_TEMP/viewer" -czf "$RUNNER_TEMP/release/wristmark-viewer-$TAG.tar.gz" .
          ls -l "$RUNNER_TEMP/release"

      - name: Read the release notes
        id: notes
        run: |
          {
            echo 'notes<<END_OF_NOTES'
            cat "$RUNNER_TEMP/notes.md"
            echo END_OF_NOTES
          } >> "$GITHUB_OUTPUT"

      # A run by hand for a tag released before (a rollback) deploys it again but
      # publishes nothing: forgejo-release fails on a release that exists.
      - name: Look for the tag's release
        id: existing
        env:
          TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: token $TOKEN" \
            "$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          case "$code" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT"; echo "$TAG has its release already: not published again" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Asking for the release of $TAG answered $code"; exit 1 ;;
          esac

      - name: Publish the release
        if: steps.existing.outputs.exists == 'false'
        uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          url: ${{ github.server_url }}
          repo: ${{ github.repository }}
          tag: ${{ env.TAG }}
          title: ${{ env.TAG }}
          release-dir: ${{ runner.temp }}/release
          prerelease: 'false'
          override: false
          release-notes: ${{ steps.notes.outputs.notes }}

      # Coolify's API, as the homelab's apps guide shows (Deploy from CI): the app
      # named like the repository, pinned to the tag's commit, then the health check
      # at its public address: the viewer's origin (docs/dev/watch.md#the-viewers-address),
      # not the panel's fqdn, which a Compose app leaves empty (its domains are per service).
      - name: Deploy the viewer
        env:
          APPS_URL: https://apps.ciepiela.org
          APPS_TOKEN: ${{ secrets.APPS_TOKEN }}
          WRISTMARK_ORIGIN: ${{ vars.WRISTMARK_ORIGIN }}
        run: |
          set -euo pipefail
          app=${GITHUB_REPOSITORY#*/}
          api() {
            curl -fsS --retry 3 -H "Authorization: Bearer $APPS_TOKEN" -H "Accept: application/json" "$@"
          }
          uuid=$(api "$APPS_URL/api/v1/applications" \
            | jq -r --arg name "$app" '[.[] | select(.name == $name)][0].uuid // empty')
          if [ -z "$uuid" ]; then
            echo "::error::The panel at $APPS_URL has no application named $app"
            exit 1
          fi
          jq -n --arg sha "$(git rev-parse HEAD)" '{git_commit_sha: $sha}' \
            | api -X PATCH -H "Content-Type: application/json" -d @- "$APPS_URL/api/v1/applications/$uuid" > /dev/null
          deployment=$(api -X POST "$APPS_URL/api/v1/deploy?uuid=$uuid&force=true" \
            | jq -r '.deployments[0].deployment_uuid')
          echo "Deployment $deployment of $app at $(git rev-parse --short HEAD)"
          status=queued
          for _ in $(seq 90); do
            details=$(api "$APPS_URL/api/v1/deployments/$deployment")
            status=$(jq -r .status <<< "$details")
            case "$status" in
              finished) break ;;
              failed | cancelled-by-user)
                # The panel keeps the log as a JSON string of entries; the hidden ones are
                # its own commands, the rest what the panel shows.
                jq -r '.logs // "[]" | (fromjson? // []) | .[] | select(.hidden | not) | .output' \
                  <<< "$details" | tail -n 40
                echo "::error::The deployment ended as $status; the end of its log is above"
                exit 1
                ;;
            esac
            sleep 10
          done
          if [ "$status" != finished ]; then
            echo "::error::The deployment did not finish within 15 minutes ($status)"
            exit 1
          fi
          address=${WRISTMARK_ORIGIN:-https://wristmark.apps.ciepiela.org}
          # The app may be asleep: the first request wakes it (a few seconds).
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors -o /dev/null "$address/healthz"
          echo "Deployed: $address"
