# The checks of every push to main and of every pull request. No artifacts are
# uploaded. Also of pushes to renovate/all-patch, which Renovate merges without a pull
# request once these pass (dawid/renovate-config): without them it saw no checks, opened
# a pull request after a day, and Forgejo merged it at once, with its android job still
# to fail (Gradle 8.14.7 with the checksum of 8.14.3, #67, 2026-11-22).
name: CI
'on':
  push:
    branches: [main, renovate/all-patch]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The viewer's lint and the watch's marker table, both from viewer/node_modules.
  checks:
    runs-on: docker
    timeout-minutes: 10
    container: docker.io/library/node:24.22.3-bookworm@sha256:6b33b0be1647d1a577f9cebb6c8fc2587cc02c98c9956af8d0289df1791a3d10
    steps:
      # The image has no git-lfs, which the checkout needs for the icons the checks
      # compare (docs/dev/ci.md#binary-files).
      - name: Install Git LFS
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git-lfs > /dev/null

      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Install the viewer's packages
        run: npm ci --prefix viewer --ignore-scripts --no-audit --no-fund

      - name: Lint the viewer
        run: npm run --prefix viewer lint

      - name: Check the tools parse
        run: for f in tools/*.mjs; do node --check "$f"; done

      # Line length and aligned tables (.markdownlint.jsonc); tools/align-tables.mjs
      # aligns them.
      - name: Lint the Markdown
        run: viewer/node_modules/.bin/markdownlint-cli2 "**/*.md" "#viewer/node_modules"

      # The watch's table must be generated from the library the viewer detects with.
      - name: Check the watch's marker table
        run: node tools/generate-dictionary.mjs --check

      # The watch shows the markers content.json gives a model, and no others.
      - name: Check the watch's list of markers with content
        run: node tools/generate-content-ids.mjs --check

      # The control channel's test vectors, made with Node's crypto, which the viewer's
      # tests and the watch's check against.
      - name: Check the control channel's test vectors
        run: node tools/generate-channel-vectors.mjs --check

      # The launcher icon is marker 0 of that table.
      - name: Check the watch's launcher icon
        run: node tools/generate-icon.mjs --check

      # The watch's viewer address and its QR code, as committed: the default origin.
      - name: Check the watch's QR code of the viewer
        run: node tools/generate-viewer-address.mjs --check

      - name: Check the watch's manifest and devices' jungle
        run: node tools/generate-devices.mjs --check

  # The marker page and the viewer in Chromium (viewer/test): every marker detected,
  # the pose's distance, and the viewer fed a marker through a fake camera. The
  # image's Playwright must be the version in viewer/package-lock.json (Renovate
  # updates both together).
  e2e:
    runs-on: docker
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --ipc=host
    steps:
      # Without LFS: the tests read none of its files, and the image has no git-lfs.
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the viewer's packages
        run: npm ci --prefix viewer --ignore-scripts --no-audit --no-fund

      # As JUnit too, for the report below: npm test's node --test takes its reporters
      # from NODE_OPTIONS, the test files' own processes included.
      - name: Run the end-to-end tests
        id: tests
        run: npm test --prefix viewer
        env:
          NODE_OPTIONS: >-
            --test-reporter=spec --test-reporter-destination=stdout
            --test-reporter=junit --test-reporter-destination=/tmp/node.xml

      # The test report runs with Python, which the image may lack.
      - name: Install Python for the test report
        if: always() && steps.tests.outcome != 'skipped'
        run: command -v python3 || { apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 > /dev/null; }

      # The results as one comment on the pull request (dawid/ci-actions), also when
      # tests failed.
      - name: Test report
        if: always() && steps.tests.outcome != 'skipped'
        uses: https://git.ciepiela.org/dawid/ci-actions/test-report@main
        with:
          junit: /tmp/node.xml

  # The control channel's relay (relay/, docs/dev/decisions/004-control-channel.md):
  # formatted, vetted, and its tests under the race detector.
  relay:
    runs-on: docker
    timeout-minutes: 10
    container: docker.io/library/golang:1.27-bookworm
    steps:
      # The Go image has no Node.js for actions/checkout: plain git, with the job's token.
      - name: Check out repository
        run: |
          git init -q . && git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          auth=$(printf 'ci:%s' "${{ github.token }}" | base64 -w0)
          git -c http.extraHeader="Authorization: Basic $auth" fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      - name: Check the formatting
        working-directory: relay
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        working-directory: relay
        run: go vet ./...

      # As JSON with the coverage, for the report below, which also prints the failed
      # tests' output.
      - name: Run the tests
        id: tests
        working-directory: relay
        run: go test -race -count=1 -json -coverprofile=/tmp/cover.out ./... > /tmp/go-test.json

      # The results and the coverage as one comment on the pull request
      # (dawid/ci-actions), also when tests failed.
      - name: Test report
        if: always() && steps.tests.outcome != 'skipped'
        uses: https://git.ciepiela.org/dawid/ci-actions/test-report@main
        with:
          go-test-json: /tmp/go-test.json
          coverage: /tmp/cover.out

  # The images are built and tested here, pushed nowhere (deployment: milestone 5).
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Build the viewer's image
        run: docker build --pull --no-cache -t "wristmark-viewer:ci-${GITHUB_RUN_ID}" viewer

      - name: Smoke test
        run: tools/smoke-test.sh "wristmark-viewer:ci-${GITHUB_RUN_ID}"

      # The relay's image: it starts as nobody and its own health check passes.
      - name: Build and check the relay's image
        run: |
          image="wristmark-relay:ci-${GITHUB_RUN_ID}"
          docker build --pull --no-cache -t "$image" relay
          docker run -d --name "relay-${GITHUB_RUN_ID}" "$image"
          for _ in $(seq 20); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "relay-${GITHUB_RUN_ID}")
            [ "$status" = healthy ] && break
            sleep 1
          done
          docker exec "relay-${GITHUB_RUN_ID}" /relay -check

      # Both together, as the panel runs them (compose.yaml): the relay's health through
      # the viewer's nginx.
      - name: The viewer with the relay
        run: |
          docker compose -p "ci-${GITHUB_RUN_ID}" up -d --build --wait
          docker compose -p "ci-${GITHUB_RUN_ID}" exec -T viewer wget -q -O - http://127.0.0.1:8080/relay/v1/healthz \
            | grep -q '"status":"ok"'

      - name: Remove the images
        if: always()
        run: |
          docker rm -f "relay-${GITHUB_RUN_ID}" || true
          docker compose -p "ci-${GITHUB_RUN_ID}" down -v --rmi local || true
          docker image rm -f "wristmark-viewer:ci-${GITHUB_RUN_ID}" "wristmark-relay:ci-${GITHUB_RUN_ID}" || true

  # The watch app compiled for every device in its manifest. The Connect IQ SDK
  # can't be downloaded here (its license, docs/dev/ci.md): it's installed by hand on
  # the runners' host and mounted read-only at /opt/connectiq in its containers,
  # whose runners offer the label connectiq (the CI broker hands every other
  # ubuntu-latest job to either host). CONNECTIQ_SDK must be a version installed
  # there (runbook connectiq-update); Renovate doesn't update it.
  watch:
    runs-on: [ubuntu-latest, connectiq]
    # Every device of the manifest compiles: a hundred or more (docs/dev/watch.md#devices).
    timeout-minutes: 30
    env:
      CONNECTIQ_SDK: 9.3.0
      CONNECTIQ_HOME: /opt/connectiq
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      # monkeyc needs Java 11 or later (Garmin's "Using Monkey C from the Command
      # Line").
      - name: Set up Java
        uses: https://github.com/actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21.0.13+100000002.0.LTS'

      # The devices the app is built for, against the device files installed: a device
      # Garmin added (connectiq-update) or one that changed shows here.
      - name: Check the watch's device list
        run: node tools/generate-devices.mjs --check --sdk "$CONNECTIQ_HOME/Devices"

      - name: Build the watch app
        run: tools/build-watch.sh "$CONNECTIQ_SDK" "$RUNNER_TEMP/watch"

  # The Android app (app/, docs/dev/android.md): its debug APK and App Bundle built from the
  # viewer's files, to see that they build; nothing is kept. The SDK and Gradle's downloads are cached.
  android:
    runs-on: docker
    timeout-minutes: 30
    container:
      image: node:24.22.3-bookworm@sha256:6b33b0be1647d1a577f9cebb6c8fc2587cc02c98c9956af8d0289df1791a3d10
    env:
      ANDROID_HOME: /root/android-sdk
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: https://github.com/actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21.0.13+100000002.0.LTS'

      - name: Cache the Android SDK and Gradle
        uses: https://github.com/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /root/android-sdk
            /root/.gradle/caches
            /root/.gradle/wrapper
          key: android-${{ hashFiles('tools/install-android-sdk.sh', 'app/android/**/*.gradle', 'app/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Install the Android SDK
        run: tools/install-android-sdk.sh "$ANDROID_HOME"

      - name: Build the debug APK and App Bundle
        run: |
          npm ci --prefix viewer --ignore-scripts --no-audit --no-fund
          tools/build-android.sh debug "$RUNNER_TEMP/apk"
          ls -l "$RUNNER_TEMP/apk"

